###############################################################################
# Build A346E Kernel -- Samsung Galaxy A34 5G (a34x), MediaTek mt6877, GKI 6.6
#
# FILE MAP
#   1. HOW TO ADD A NEW FEATURE BUTTON -- the recipe, with EXAMPLE markers
#   2. TRIGGERS + MENU                 -- what you pick in "Run workflow"
#   3. SETTINGS (env)                  -- menu choices -> internal variables
#   4. JOBS                            -- #1..#7, the pipeline
#
# PIPELINE (7 stages, linear, one fresh runner per stage)
#   #1 Checkout & Detect  -> confirm the kernel tree and build options exist
#   #2 System Prep        -> confirm the runner has enough disk and tools
#   #3 External Deps      -> confirm KernelSU-Next / SUSFS sources are reachable
#   #4 Patches            -> dry-run every patch the build will apply for real
#   #5 KernelSU           -> resolve the KSU version, print the defconfig plan
#   #6 Build              -> the real build (self-contained: its own checkout,
#                             deps, KSU, patches -- every job runs on its own
#                             fresh runner, nothing carries over between jobs)
#   #7 Upload & Summary   -> publish artifacts, post the final run checklist
#
# #1..#5 are fast validation jobs (about 1 minute each). Each step's summary
# line is a CHECKLIST item: everything it confirms is something #6 will also
# do for real, so a broken patch or a missing file fails the run in a minute
# instead of 50 minutes into the compile.
#
# #6 applies the permissive patch itself, through build_kernel.sh's
# apply_optional_patches (never a pre-flight job): doing that in a pre-flight
# job once silently produced an ENFORCING kernel while the artifact still
# said "permissive".
#
# MENU
#   Root variant    : NO-ROOT | KSU Next Latest | KSU Next + SUSFS v1.5.12
#   Feature toggles : Advanced Network Configs, All NameSpaces,
#                      Package AnyKernel3 zip, Bundle kernel modules (tar.xz -9)
#   Build options   : SELinux permissive, extra patches from patch/*.patch
# A push to A346E or Game builds "KSU Next Latest" with every feature toggle
# ON (the variant that actually gets flashed). A pull_request builds NO-ROOT.
#
# -----------------------------------------------------------------------------
# HOW TO ADD A NEW FEATURE BUTTON   (example: "Enable Example Feature")
#   1. MENU       add a boolean input under workflow_dispatch.inputs -> EXAMPLE 1
#   2. SETTINGS   add one FEAT_* line in the env block               -> EXAMPLE 2
#   3. DEFCONFIG  add an add_block section in job #6 "Defconfig"     -> EXAMPLE 3
#   4. OPTIONAL   surface it in the artifact name / checklists       -> EXAMPLE 4
# To add more config lines to an EXISTING toggle, just extend its add_block
# heredoc in step 3 -- nothing else needs to change.
###############################################################################
name: Build A346E Kernel

# =============================================================================
# 2. TRIGGERS + MENU
# =============================================================================
on:
  workflow_dispatch:
    inputs:
      # ---- Root variant ------------------------------------------------------
      # The option text is mapped to an internal id in section 3 (KSU_VAR).
      # Rename an option here and rename it there too.
      ksu_variant:
        description: "Root variant"
        required: true
        type: choice
        options:
          - NO-ROOT
          - KSU Next Latest
          - KSU Next + SUSFS v1.5.12
        default: KSU Next Latest

      # ---- Feature toggles (apply to every root variant) ----------------------
      net_adv:
        description: "Enable Advanced Network Configs (IPSet, Netfilter, firewall)"
        required: true
        type: boolean
        default: true
      all_ns:
        description: "Enable All NameSpaces (container isolation)"
        required: true
        type: boolean
        default: true
      anykernel3:
        description: "Package as a flashable AnyKernel3 zip"
        required: true
        type: boolean
        default: true
      modules_tarxz:
        description: "Bundle all .ko kernel modules (tar.xz, max compression)"
        required: true
        type: boolean
        default: false
      # EXAMPLE 1 -- new toggle: uncomment, then do steps 2 and 3 below
      # example_feature:
      #   description: "Enable Example Feature"
      #   required: true
      #   type: boolean
      #   default: false

      # ---- Build options --------------------------------------------------
      permissive:
        description: "Make SELinux permissive?"
        type: boolean
        required: true
        default: false
      custom_patches:
        description: "Also apply extra patches from patch/*.patch?"
        type: boolean
        required: true
        default: false
  push:
    branches:
      - A346E
      - Game
  pull_request:
    branches:
      - A346E
      - Game

permissions:
  contents: read
  issues: write

# A newer push on the same branch supersedes an older, still-running build.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# =============================================================================
# 3. SETTINGS -- menu choices become variables here. Every job reads these.
#    On push / pull_request there is no menu, so the value after `||` applies.
# =============================================================================
env:
  G_EXT: ${{ github.workspace }}/external_deps
  AK3_REPO: https://github.com/BS1388/AnyKernel3-a34x.git

  # KernelSU-Next source per root variant, defined once and reused by
  # #3 (reachability check), #5 (version resolve) and #6 (real setup).
  KSUN_REPO_STD: https://github.com/KernelSU-Next/KernelSU-Next.git
  KSUN_BRANCH_STD: dev
  KSUN_REPO_SUSFS: https://github.com/xnnnsets/KernelSU-Next.git
  KSUN_BRANCH_SUSFS: next-1

  # SUSFS source, defined once and reused by #3 and #6.
  SUSFS_REPO: https://gitlab.com/simonpunk/susfs4ksu.git
  SUSFS_BRANCH: gki-android15-6.6
  SUSFS_COMMIT: f450ec00bf592d080f59b01ff6f9242456c9a427
  SUSFS_EXTRA_REPOS: >-
    https://github.com/xnnnsets/kernel_patches.git
    https://github.com/xnnnsets/patch.git
    https://github.com/SukiSU-Ultra/SukiSU_patch.git

  # Root variant: menu text -> internal id (used by every `if:` / `case` below).
  # The text on the left must match the menu options in section 2 exactly.
  KSU_VAR: ${{ (github.event.inputs.ksu_variant == 'KSU Next Latest' && 'KSUN') || (github.event.inputs.ksu_variant == 'KSU Next + SUSFS v1.5.12' && 'KSUN-SUSFS-v1.5.12') || (github.event.inputs.ksu_variant == 'NO-ROOT' && 'NO-ROOT') || (github.event_name == 'push' && 'KSUN') || 'NO-ROOT' }}

  # Feature toggles: 'true' / 'false'. Fallback on push / pull_request = ON,
  # except modules_tarxz which stays opt-in (adds a second, large artifact).
  FEAT_NET_ADV: ${{ github.event.inputs.net_adv || 'true' }}
  FEAT_ALL_NS: ${{ github.event.inputs.all_ns || 'true' }}
  FEAT_ANYKERNEL3: ${{ github.event.inputs.anykernel3 || 'true' }}
  FEAT_MODULES_TARXZ: ${{ github.event.inputs.modules_tarxz || 'false' }}
  # EXAMPLE 2 -- one line per new toggle (value after || = push / PR default):
  # FEAT_EXAMPLE: ${{ github.event.inputs.example_feature || 'false' }}

  # Build options
  PERMISSIVE: ${{ github.event.inputs.permissive || 'false' }}
  CUSTOM_PATCH: ${{ github.event.inputs.custom_patches || 'false' }}

# =============================================================================
# 4. JOBS
# =============================================================================
jobs:
  # ==========================================================================
  # #1 Checkout & Detect -- confirm the kernel tree and chosen options exist
  # ==========================================================================
  detect:
    name: "#1 Checkout & Detect"
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Job header
        run: |
          {
            echo "## Build A346E Kernel"
            echo ""
            echo "Pipeline: #1 -> #2 -> #3 -> #4 -> #5 -> #6 -> #7"
            echo ""
            echo "| setting | value |"
            echo "|---|---|"
            echo "| Root variant | \`${KSU_VAR}\` |"
            echo "| Advanced Network Configs | \`${FEAT_NET_ADV}\` |"
            echo "| All NameSpaces | \`${FEAT_ALL_NS}\` |"
            echo "| Package AnyKernel3 | \`${FEAT_ANYKERNEL3}\` |"
            echo "| Bundle modules (tar.xz) | \`${FEAT_MODULES_TARXZ}\` |"
            echo "| SELinux permissive | \`${PERMISSIVE}\` |"
            echo "| Extra patches (patch/*.patch) | \`${CUSTOM_PATCH}\` |"
            echo "| Commit | \`${GITHUB_SHA:0:12}\` |"
            echo ""
            echo "### #1 Checkout & Detect"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Detect kernel tree
        run: |
          set -eu
          REAL_DIR=""
          for d in Kernel-6.6 kernel-6.6; do
            if [ -f "$d/Makefile" ]; then REAL_DIR="$d"; break; fi
          done
          [ -n "$REAL_DIR" ] || { echo "::error::No kernel tree found (looked for Kernel-6.6/ and kernel-6.6/)"; ls -la; exit 1; }
          VER=$(awk '/^(VERSION|PATCHLEVEL|SUBLEVEL) =/{printf "%s%s", s, $3; s="."}' "$REAL_DIR/Makefile")
          echo "kernel tree: $REAL_DIR ($VER)"
          echo "- [x] Kernel tree found: \`${REAL_DIR}\` (\`${VER}\`)" >> "$GITHUB_STEP_SUMMARY"

      - name: Detect gki_defconfig
        run: |
          set -eu
          REAL_DIR=$([ -f Kernel-6.6/Makefile ] && echo Kernel-6.6 || echo kernel-6.6)
          [ -f "$REAL_DIR/arch/arm64/configs/gki_defconfig" ] \
            || { echo "::error::gki_defconfig missing in $REAL_DIR"; exit 1; }
          echo "- [x] gki_defconfig present in \`${REAL_DIR}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Detect Google-FDO
        run: |
          set -eu
          if [ -f Google-FDO/kernel.afdo ] || [ -f google-FDO/kernel.afdo ]; then
            echo "- [x] Google-FDO/kernel.afdo present" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::Google-FDO/kernel.afdo missing"
            echo "- [ ] Google-FDO/kernel.afdo present (missing -- see warning)" >> "$GITHUB_STEP_SUMMARY"
          fi

  # ==========================================================================
  # #2 System Prep -- confirm the runner has enough disk space and tools
  # ==========================================================================
  system-prep:
    name: "#2 System Prep"
    needs: detect
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Check disk space
        run: |
          set -eu
          AVAIL=$(df -BG --output=avail / | tail -1 | tr -dc '0-9')
          echo "free disk: ${AVAIL} GB"
          if [ "$AVAIL" -lt 10 ]; then
            echo "::error::only ${AVAIL} GB free on / - the kleaf build cannot fit"
            exit 1
          elif [ "$AVAIL" -lt 20 ]; then
            echo "::warning::only ${AVAIL} GB free on / before cleanup, build may run tight"
          fi
          {
            echo "### #2 System Prep"
            echo "- [x] Disk space: \`${AVAIL} GB\` free (#6 frees ~25 GB more before building)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check required tools
        run: |
          set -eu
          for t in git curl python3 tar xz; do
            command -v "$t" >/dev/null || { echo "::error::missing $t"; exit 1; }
          done
          echo "- [x] Required tools present: git, curl, python3, tar, xz" >> "$GITHUB_STEP_SUMMARY"

  # ==========================================================================
  # #3 External Deps -- confirm KernelSU-Next / SUSFS sources are reachable
  # ==========================================================================
  external-deps:
    name: "#3 External Deps"
    needs: system-prep
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Job header
        run: |
          echo "### #3 External Deps" >> "$GITHUB_STEP_SUMMARY"

      - name: Check AnyKernel3 repo
        if: env.FEAT_ANYKERNEL3 == 'true'
        run: |
          set -eu
          git ls-remote --exit-code "$AK3_REPO" HEAD >/dev/null \
            || { echo "::error::AnyKernel3 repo unreachable: $AK3_REPO"; exit 1; }
          echo "- [x] AnyKernel3 repo reachable: \`${AK3_REPO}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Check KernelSU-Next source
        if: env.KSU_VAR != 'NO-ROOT'
        run: |
          set -eu
          if [ "$KSU_VAR" = "KSUN" ]; then
            REPO="$KSUN_REPO_STD"; BRANCH="$KSUN_BRANCH_STD"
          else
            REPO="$KSUN_REPO_SUSFS"; BRANCH="$KSUN_BRANCH_SUSFS"
          fi
          URL="${REPO/github.com/raw.githubusercontent.com}"
          URL="${URL%.git}/refs/heads/${BRANCH}/kernel/setup.sh"
          curl -fsSL --retry 3 "$URL" -o /tmp/setup.sh
          head -n 1 /tmp/setup.sh | grep -q '^#!' || { echo "::error::setup.sh does not look like a script"; exit 1; }
          echo "- [x] KernelSU-Next setup.sh reachable: \`${BRANCH}\` branch ($(wc -l < /tmp/setup.sh) lines)" >> "$GITHUB_STEP_SUMMARY"

      - name: Fetch & verify SUSFS repos
        if: env.KSU_VAR == 'KSUN-SUSFS-v1.5.12'
        run: |
          set -eu
          mkdir -p "$G_EXT" && cd "$G_EXT"
          git clone --depth 1 -b "$SUSFS_BRANCH" "$SUSFS_REPO" susfs4ksu
          ( cd susfs4ksu
            git fetch --depth 1 origin "$SUSFS_COMMIT" || true
            git checkout "$SUSFS_COMMIT" || echo "::warning::pinned SUSFS commit unavailable, HEAD used" )
          for repo in $SUSFS_EXTRA_REPOS; do
            git clone --depth 1 "$repo"
          done
          MISSING=0
          for f in "susfs4ksu/kernel_patches/50_add_susfs_in_gki-android15-6.6.patch" \
                   "susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch" \
                   "patch/6.6/Dont_reduce_TTL.patch" \
                   "kernel_patches/wild/hooks/scope_min_manual_hooks_v1.4.patch" \
                   "kernel_patches/wild/susfs_fix_patches/v1.5.12/1_fix_base.c.patch"; do
            if [ -f "$f" ]; then echo "OK      $f"; else echo "::error::MISSING $f"; MISSING=1; fi
          done
          [ "$MISSING" = "0" ] || exit 1
          echo "- [x] SUSFS repos fetched and all required patch files present" >> "$GITHUB_STEP_SUMMARY"

      - name: NO-ROOT has no external deps
        if: env.KSU_VAR == 'NO-ROOT'
        run: |
          echo "- [x] NO-ROOT variant: no external dependencies to check" >> "$GITHUB_STEP_SUMMARY"

  # ==========================================================================
  # #4 Patches -- dry-run every patch the build will apply for real.
  #    Order and behaviour mirrors build_kernel.sh exactly:
  #      always              : kernel/patches-kernel-6.6/*.patch
  #      if PERMISSIVE=true  : Permissive/selinux-make-permissive.patch
  #      if CUSTOM_PATCH=true: patch/*.patch
  # ==========================================================================
  patches:
    name: "#4 Patches"
    needs: external-deps
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Job header
        run: |
          echo "### #4 Patches" >> "$GITHUB_STEP_SUMMARY"

      # Every job runs on its own runner: detect locally instead of pulling an
      # output from a job that is not a *direct* dependency -- needs.<job>
      # only resolves for direct needs.
      - name: Detect kernel dir
        run: |
          set -eu
          for d in Kernel-6.6 kernel-6.6; do
            if [ -f "$d/Makefile" ]; then echo "KDIR=$d" >> "$GITHUB_ENV"; exit 0; fi
          done
          echo "::error::no kernel tree found"; exit 1

      - name: kernel-6.6 patches (always applied)
        run: |
          set -eu
          A="kernel/patches-kernel-6.6/apply.sh"
          [ -f "$A" ] || { echo "::error::$A missing"; exit 1; }
          chmod +x "$A"
          bash "$A" --check "$KDIR"
          echo "- [x] kernel/patches-kernel-6.6/*.patch dry-run applied cleanly to \`${KDIR}\`" >> "$GITHUB_STEP_SUMMARY"

      # These fixes live directly in Samsung's own trees (vendor/,
      # kernel/kernel_device_modules-6.6/) because we never replace those
      # wholesale, just make sure none of them got lost.
      - name: Verify in-tree fixes (vendor / device modules)
        run: |
          set -eu
          FAIL=0
          check() { # check <description> <file> <grep-pattern>
            if [ -f "$2" ] && grep -q "$3" "$2"; then
              echo "OK      $1"
            else
              echo "::error::MISSING $1  ($2)"; FAIL=1
            fi
          }
          BT="kernel/kernel_device_modules-6.6/sound/soc/mediatek/common/mtk-btcvsd.c"
          check "SEC_PM Kconfig"                  "kernel/kernel_device_modules-6.6/drivers/samsung/pm/Kconfig" "config SEC_PM"
          check "MAX/MIN guard (stp_uart)"        "vendor/mediatek/kernel_modules/connectivity/common/common_main/linux/stp_uart.c" "#ifndef MAX"
          check "BTCVSD SCO resync/xrun recovery" "$BT" "mtk_btcvsd_snd_band_resync"
          check "BTCVSD rx overrun self-recovery" "$BT" "mtk_btcvsd_snd_rx_resync"
          check "BTCVSD silence priming"          "$BT" "mtk_btcvsd_snd_silence_prime"

          # zram: upstream line is `= CONFIG_ZRAM_DEF_COMP;`. A hand-edit once
          # turned it into `= lzo-rle;` without quotes, which breaks the build.
          Z="$KDIR/drivers/block/zram/zram_drv.c"
          if grep -qE '^static const char \*default_compressor = (CONFIG_ZRAM_DEF_COMP|"[a-z0-9-]+");' "$Z"; then
            echo "OK      zram default_compressor is valid C"
          else
            echo "::error::BROKEN zram default_compressor:"; grep -n "default_compressor =" "$Z" || true; FAIL=1
          fi

          HITS=$(grep -rl --include=*.c --include=*.h "get_current_cred_module\|put_cred_module" vendor 2>/dev/null || true)
          if [ -n "$HITS" ]; then
            echo "::error::Samsung-only cred API still present in vendor/:"
            echo "$HITS" | sed 's/^/          /'
            FAIL=1
          else
            echo "OK      no Samsung-only cred API in vendor/"
          fi

          [ "$FAIL" = "0" ] || { echo "::error::a fix is missing from the source tree - the build would fail"; exit 1; }
          echo "- [x] All in-tree vendor / device module fixes present" >> "$GITHUB_STEP_SUMMARY"

      - name: SELinux permissive patch
        if: env.PERMISSIVE == 'true'
        run: |
          set -eu
          P="Permissive/selinux-make-permissive.patch"
          [ -f "$P" ] || { echo "::error::PERMISSIVE=true but $P is missing"; exit 1; }
          if patch -p1 -d "$KDIR" --dry-run --forward --batch < "$P" > /tmp/perm.log 2>&1; then
            echo "APPLIES $(basename "$P") -> $KDIR"
          elif grep -q "Reversed (or previously applied)" /tmp/perm.log; then
            echo "ALREADY $(basename "$P")"
          else
            echo "::error::permissive patch does not apply"; cat /tmp/perm.log; exit 1
          fi
          echo "- [x] SELinux permissive patch validated (applied for real in #6)" >> "$GITHUB_STEP_SUMMARY"

      - name: Skip permissive patch
        if: env.PERMISSIVE != 'true'
        run: |
          echo "- [ ] SELinux permissive patch skipped (PERMISSIVE=false, stays enforcing)" >> "$GITHUB_STEP_SUMMARY"

      - name: Extra patches from patch/*.patch
        if: env.CUSTOM_PATCH == 'true'
        run: |
          set -eu
          shopt -s nullglob
          EXTRA=(patch/*.patch)
          shopt -u nullglob
          if [ ${#EXTRA[@]} -eq 0 ]; then
            echo "::warning::CUSTOM_PATCH=true but patch/ has no *.patch file"
            echo "- [ ] Extra patches: none found in patch/*.patch" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          FAIL=0
          for p in "${EXTRA[@]}"; do
            base=$(basename "$p")
            if patch -p1 -d "$KDIR" --dry-run --forward --batch < "$p" > /tmp/out.log 2>&1; then
              echo "APPLIES $base -> $KDIR"
            elif grep -q "Reversed (or previously applied)" /tmp/out.log; then
              echo "ALREADY $base"
            else
              echo "::error::BROKEN  $base"; sed 's/^/          /' /tmp/out.log; FAIL=1
            fi
          done
          [ "$FAIL" = "0" ] || exit 1
          echo "- [x] Extra patches validated: ${#EXTRA[@]} file(s) in patch/*.patch" >> "$GITHUB_STEP_SUMMARY"

      - name: Skip extra patches
        if: env.CUSTOM_PATCH != 'true'
        run: |
          echo "- [ ] Extra patches skipped (CUSTOM_PATCH=false)" >> "$GITHUB_STEP_SUMMARY"

  # ==========================================================================
  # #5 KernelSU -- resolve the version #6 will build and print the
  #    defconfig plan. No tag or pinning: always the dev branch HEAD.
  # ==========================================================================
  kernelsu:
    name: "#5 KernelSU"
    needs: patches
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Job header
        run: |
          echo "### #5 KernelSU" >> "$GITHUB_STEP_SUMMARY"

      - name: Resolve KernelSU-Next version
        id: resolve
        if: env.KSU_VAR != 'NO-ROOT'
        run: |
          set -eu
          if [ "$KSU_VAR" = "KSUN" ]; then
            REPO="$KSUN_REPO_STD"; BRANCH="$KSUN_BRANCH_STD"
          else
            REPO="$KSUN_REPO_SUSFS"; BRANCH="$KSUN_BRANCH_SUSFS"
          fi
          git clone -q --branch "$BRANCH" "$REPO" /tmp/ksun
          cd /tmp/ksun
          TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo dev)
          CODE=$((30000 + $(git rev-list --count HEAD)))
          SHA=$(git rev-parse --short HEAD)
          { echo "ksu_tag=$TAG"; echo "ksu_code=$CODE"; echo "ksu_sha=$SHA"; } >> "$GITHUB_OUTPUT"
          echo "KernelSU-Next $BRANCH: $TAG ($CODE) @ $SHA"
          grep -q KSU_VERSION_FALLBACK kernel/Kbuild \
            || echo "::warning::kernel/Kbuild has no KSU_VERSION_FALLBACK - the v0.0.1 fix may need updating"
          echo "- [x] KernelSU-Next resolved: \`${TAG}\` (\`${CODE}\`) @ \`${SHA}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Skip resolve (NO-ROOT)
        if: env.KSU_VAR == 'NO-ROOT'
        run: |
          echo "- [x] NO-ROOT variant: no KernelSU-Next version to resolve" >> "$GITHUB_STEP_SUMMARY"

      - name: Defconfig plan
        run: |
          set -eu
          echo "gki_defconfig additions for $KSU_VAR (between the '# >>> a346e-ci' markers):"
          case "$KSU_VAR" in
            KSUN)               echo "  CONFIG_KSU=y, CONFIG_KPROBES=y, CONFIG_KPROBE_EVENTS=y, CONFIG_MODULES=y" ;;
            KSUN-SUSFS-v1.5.12) echo "  CONFIG_KSU=y, CONFIG_KSU_KPROBES_HOOK=n + 15 CONFIG_KSU_SUSFS_* options" ;;
            NO-ROOT)             echo "  (none)" ;;
          esac
          echo "  + Advanced Network Configs (IPSet, Netfilter): $FEAT_NET_ADV"
          echo "  + All NameSpaces (container isolation):        $FEAT_ALL_NS"
          {
            echo "- [x] Defconfig plan for \`${KSU_VAR}\`:"
            case "$KSU_VAR" in
              KSUN)               echo "  - CONFIG_KSU, CONFIG_KPROBES, CONFIG_KPROBE_EVENTS, CONFIG_MODULES" ;;
              KSUN-SUSFS-v1.5.12) echo "  - CONFIG_KSU + 15 CONFIG_KSU_SUSFS_* options" ;;
              NO-ROOT)             echo "  - (root variant adds nothing)" ;;
            esac
            echo "- [$( [ "$FEAT_NET_ADV" = "true" ] && echo x || echo ' ' )] Advanced Network Configs: \`${FEAT_NET_ADV}\`"
            echo "- [$( [ "$FEAT_ALL_NS" = "true" ] && echo x || echo ' ' )] All NameSpaces: \`${FEAT_ALL_NS}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # ==========================================================================
  # #6 Build -- the real one. Self-contained: fresh runner, fresh checkout.
  # ==========================================================================
  build:
    name: "#6 Build"
    needs: kernelsu
    runs-on: ubuntu-22.04
    timeout-minutes: 330
    outputs:
      image_size: ${{ steps.build.outputs.image_size }}
      image_sha: ${{ steps.build.outputs.image_sha }}
      artifact: ${{ steps.meta.outputs.artifact }}
      selinux: ${{ steps.meta.outputs.selinux }}
      ksu_tag: ${{ steps.ksu.outputs.ksu_tag }}
      ksu_code: ${{ steps.ksu.outputs.ksu_code }}
      modules_tarball: ${{ steps.modules.outputs.tarball }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Free disk space
        run: |
          set -eu
          echo "--- before ---"; df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost \
                      /usr/local/lib/android /opt/hostedtoolcache/CodeQL \
                      /opt/hostedtoolcache/go /opt/hostedtoolcache/Ruby || true
          sudo apt-get remove --purge -y '^php.*' '^dotnet-.*' '^mysql-.*' \
                      '^firefox.*' '^mongodb-.*' '^postgresql-.*' azure-cli \
                      google-chrome-stable google-cloud-cli >/dev/null 2>&1 || true
          sudo apt-get autoremove -y >/dev/null 2>&1 || true
          sudo apt-get clean || true
          echo "--- after ---"; df -h /

      - name: Install host dependencies
        run: |
          set -eu
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            curl wget unzip git rsync ca-certificates \
            bc bison flex build-essential \
            libssl-dev libelf-dev libncurses-dev dwarves \
            lz4 zstd cpio libxml2-utils xsltproc \
            python3 python3-pip python3-setuptools python3-dev \
            zlib1g-dev libbz2-dev liblz4-dev libzstd-dev
          git config --global user.email "builder@example.com"
          git config --global user.name  "Builder"
          git config --global --add safe.directory "*"

      - name: Set kernel dir & artifact name
        id: meta
        run: |
          set -eu
          REAL_DIR=""
          for d in Kernel-6.6 kernel-6.6; do
            if [ -f "$d/Makefile" ]; then REAL_DIR="$d"; break; fi
          done
          [ -n "$REAL_DIR" ] || { echo "::error::no kernel tree found"; exit 1; }
          SEL=$([ "$PERMISSIVE" = "true" ] && echo permissive || echo enforcing)
          CUS=$([ "$CUSTOM_PATCH" = "true" ] && echo custom || echo nocustom)
          { echo "REAL_DIR=$REAL_DIR"; echo "G_KERNEL=$GITHUB_WORKSPACE/$REAL_DIR"; } >> "$GITHUB_ENV"
          echo "selinux=$SEL" >> "$GITHUB_OUTPUT"

          # artifact name = variant + SELinux + custom + one tag per enabled
          # feature that changes the output shape
          TAGS=""
          [ "$FEAT_NET_ADV" = "true" ] && TAGS="${TAGS}-net" || true
          [ "$FEAT_ALL_NS" = "true" ]  && TAGS="${TAGS}-ns"  || true
          # EXAMPLE 4: [ "$FEAT_EXAMPLE" = "true" ] && TAGS="${TAGS}-example" || true
          echo "artifact=kernel-${KSU_VAR}-${SEL}-${CUS}${TAGS}" >> "$GITHUB_OUTPUT"

      - name: External deps (SUSFS only)
        if: env.KSU_VAR == 'KSUN-SUSFS-v1.5.12'
        run: |
          set -eu
          mkdir -p "$G_EXT" && cd "$G_EXT"
          [ -d susfs4ksu ] || git clone --depth 1 -b "$SUSFS_BRANCH" "$SUSFS_REPO" susfs4ksu
          ( cd susfs4ksu
            git fetch --depth 1 origin "$SUSFS_COMMIT" || true
            git checkout "$SUSFS_COMMIT" || true )
          for repo in $SUSFS_EXTRA_REPOS; do
            dir=$(basename "$repo" .git)
            [ -d "$dir" ] || git clone --depth 1 "$repo"
          done

      - name: SUSFS kernel patches
        if: env.KSU_VAR == 'KSUN-SUSFS-v1.5.12'
        run: |
          set -eu
          SUSFS_DIR="$G_EXT/susfs4ksu"
          cd "$G_KERNEL"
          cp -v "$SUSFS_DIR"/kernel_patches/include/linux/* include/linux/ || true
          cp -v "$SUSFS_DIR"/kernel_patches/fs/*            fs/            || true
          for p in "$G_EXT/patch/6.6/Dont_reduce_TTL.patch" \
                   "$G_EXT/kernel_patches/wild/hooks/scope_min_manual_hooks_v1.4.patch" \
                   "$SUSFS_DIR/kernel_patches/50_add_susfs_in_gki-android15-6.6.patch" \
                   "$G_EXT/kernel_patches/wild/susfs_fix_patches/v1.5.12/1_fix_base.c.patch"; do
            echo "--- $(basename "$p")"
            patch -p1 --forward --batch < "$p" || echo "::warning::$(basename "$p") failed / already applied"
          done
          # GKI protected exports block SUSFS symbols
          grep -rl "protected_exports_list" --include="BUILD.bazel" "$G_KERNEL" 2>/dev/null | while read -r f; do
            sed -i '/"protected_exports_list"[[:space:]]*:[[:space:]]*"android\/abi_gki_protected_exports_aarch64",\?/d' "$f"
          done
          find "$G_KERNEL" -iname "abi_gki_protected_exports*" -type f -delete 2>/dev/null || true

      - name: Add KernelSU-Next
        id: ksu
        if: env.KSU_VAR != 'NO-ROOT'
        run: |
          set -eu
          cd "$G_KERNEL"
          rm -rf KernelSU-Next
          case "$KSU_VAR" in
            KSUN)
              # setup.sh does a fresh clone every run -> always the newest dev
              # HEAD, today and a year from now. No tag, no pinning, no input.
              curl -LSs --retry 3 "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/refs/heads/${KSUN_BRANCH_STD}/kernel/setup.sh" -o /tmp/ksun_setup.sh
              sh /tmp/ksun_setup.sh "$KSUN_BRANCH_STD"
              ;;
            KSUN-SUSFS-v1.5.12)
              curl -LSs --retry 3 "https://raw.githubusercontent.com/xnnnsets/KernelSU-Next/refs/heads/${KSUN_BRANCH_SUSFS}/kernel/setup.sh" -o /tmp/ksun_setup.sh
              sh /tmp/ksun_setup.sh "$KSUN_BRANCH_SUSFS"
              for p in "$G_EXT/susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch" \
                       "$G_EXT/kernel_patches/wild/susfs_fix_patches/v1.5.12/fix_core_hook.c.patch" \
                       "$G_EXT/kernel_patches/wild/susfs_fix_patches/v1.5.12/fix_sucompat.c.patch" \
                       "$G_EXT/kernel_patches/wild/susfs_fix_patches/v1.5.12/fix_kernel_compat.c.patch"; do
                echo "--- $(basename "$p")"
                patch -p1 -d ./KernelSU-Next --forward --batch < "$p" || echo "::warning::$(basename "$p") failed / already applied"
              done
              ;;
          esac
          [ -d KernelSU-Next ] || { echo "::error::KernelSU-Next missing after setup.sh"; exit 1; }

          cd KernelSU-Next
          KSU_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo dev)
          KSU_CODE=$((30000 + $(git rev-list --count HEAD 2>/dev/null || echo 0)))
          KSU_SHA=$(git rev-parse --short HEAD 2>/dev/null || echo unknown)

          # rsync --copy-links in build_kernel.sh drops the git repo, so Kbuild
          # would fall back to v0.0.1 - bake the real values in now.
          if [ -f kernel/Kbuild ] && grep -q KSU_VERSION_FALLBACK kernel/Kbuild; then
            sed -i "s|^KSU_VERSION_FALLBACK := .*|KSU_VERSION_FALLBACK := ${KSU_CODE}|"        kernel/Kbuild
            sed -i "s|^KSU_VERSION_TAG_FALLBACK := .*|KSU_VERSION_TAG_FALLBACK := ${KSU_TAG}|" kernel/Kbuild
            grep -n "KSU_VERSION_FALLBACK\|KSU_VERSION_TAG_FALLBACK" kernel/Kbuild
          else
            echo "::warning::KSU_VERSION_FALLBACK not found in kernel/Kbuild (layout changed?)"
          fi

          { echo "KSU_GIT_TAG=$KSU_TAG"; echo "KSU_VERSION=$KSU_CODE"; echo "KSU_COMMIT=$KSU_SHA"; } >> "$GITHUB_ENV"
          { echo "ksu_tag=$KSU_TAG"; echo "ksu_code=$KSU_CODE"; } >> "$GITHUB_OUTPUT"
          echo "KernelSU-Next $KSU_TAG ($KSU_CODE) @ $KSU_SHA"

      # Layout of this step:  (A) root variant   (B) feature toggles
      # Config lines inside <<'EOF' must sit at the SAME indent as the script
      # (YAML strips the step's own indent, so bash sees them at column 0 and
      # EOF still terminates the heredoc correctly).
      - name: Defconfig (variant + feature toggles)
        run: |
          set -eu
          DEFCONFIG="$G_KERNEL/arch/arm64/configs/gki_defconfig"

          # add_block "<title>": reads config lines from stdin (heredoc) and
          # appends them, under a "# --- <title>" comment, to gki_defconfig.
          add_block() { { echo "# --- $1"; cat; } >> "$DEFCONFIG"; }

          # Everything we add lives between markers, so re-running only ever
          # replaces our own block and never touches upstream lines (the old
          # code deleted CONFIG_KPROBES=y and only put it back for KSUN, so
          # NO-ROOT builds silently lost kprobes).
          sed -i '/^# >>> a346e-ci$/,/^# <<< a346e-ci$/d' "$DEFCONFIG"
          echo "# >>> a346e-ci" >> "$DEFCONFIG"

          # ===== (A) root variant ==============================================
          case "$KSU_VAR" in
            KSUN)
              add_block "KernelSU-Next" <<'EOF'
          CONFIG_KSU=y
          CONFIG_KPROBES=y
          CONFIG_KPROBE_EVENTS=y
          CONFIG_MODULES=y
          EOF
              ;;
            KSUN-SUSFS-v1.5.12)
              add_block "KernelSU-Next + SUSFS v1.5.12" <<'EOF'
          CONFIG_KSU=y
          CONFIG_KSU_KPROBES_HOOK=n
          CONFIG_MODULES=y
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_TRY_UMOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_SUS_OVERLAYFS=n
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
          CONFIG_KSU_SUSFS_SUS_SU=n
          EOF
              ;;
          esac

          # ===== (B) feature toggles (any root variant) =========================
          # Toggle: "Enable Advanced Network Configs"  (env FEAT_NET_ADV)
          # IPSet plus the Netfilter/firewall extras (NAT, REJECT/LOG targets,
          # recent-list matching) that firewall and adblock apps rely on.
          # Add more network configs by extending this heredoc.
          if [ "$FEAT_NET_ADV" = "true" ]; then
            add_block "Advanced Network Configs (IPSet + Netfilter)" <<'EOF'
          CONFIG_IP_SET=y
          CONFIG_IP_SET_MAX=65534
          CONFIG_IP_SET_BITMAP_IP=y
          CONFIG_IP_SET_BITMAP_IPMAC=y
          CONFIG_IP_SET_BITMAP_PORT=y
          CONFIG_IP_SET_HASH_IP=y
          CONFIG_IP_SET_HASH_IPMARK=y
          CONFIG_IP_SET_HASH_IPPORT=y
          CONFIG_IP_SET_HASH_IPPORTIP=y
          CONFIG_IP_SET_HASH_IPPORTNET=y
          CONFIG_IP_SET_HASH_IPMAC=y
          CONFIG_IP_SET_HASH_MAC=y
          CONFIG_IP_SET_HASH_NETPORTNET=y
          CONFIG_IP_SET_HASH_NET=y
          CONFIG_IP_SET_HASH_NETNET=y
          CONFIG_IP_SET_HASH_NETPORT=y
          CONFIG_IP_SET_HASH_NETIFACE=y
          CONFIG_IP_SET_LIST_SET=y
          CONFIG_NETFILTER_XT_SET=y
          CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y
          CONFIG_NETFILTER_XT_TARGET_REJECT=y
          CONFIG_NETFILTER_XT_TARGET_LOG=y
          CONFIG_NETFILTER_XT_MATCH_RECENT=y
          EOF
          fi

          # Toggle: "Enable All NameSpaces"  (env FEAT_ALL_NS)
          # Namespace isolation plus the container-adjacent primitives
          # (SysV IPC, POSIX message queues, device nodes, tmpfs ACL/xattr)
          # that a namespaced userspace (Termux/proot, containers) expects.
          if [ "$FEAT_ALL_NS" = "true" ]; then
            add_block "All NameSpaces (container isolation)" <<'EOF'
          CONFIG_NAMESPACES=y
          CONFIG_UTS_NS=y
          CONFIG_IPC_NS=y
          CONFIG_PID_NS=y
          CONFIG_NET_NS=y
          CONFIG_USER_NS=y
          CONFIG_TIME_NS=y
          CONFIG_SYSVIPC=y
          CONFIG_POSIX_MQUEUE=y
          CONFIG_DEVTMPFS=y
          CONFIG_TMPFS_POSIX_ACL=y
          CONFIG_TMPFS_XATTR=y
          EOF
          fi

          # EXAMPLE 3 -- new toggle: copy this block, change the env name, the
          # title and the CONFIG_* lines (keep the lines at this indent):
          # if [ "$FEAT_EXAMPLE" = "true" ]; then
          #   add_block "Example Feature" <<'EOF'
          # CONFIG_EXAMPLE_ONE=y
          # CONFIG_EXAMPLE_TWO=y
          # EOF
          # fi

          echo "# <<< a346e-ci" >> "$DEFCONFIG"
          echo "--- a346e-ci block in gki_defconfig ---"
          sed -n '/^# >>> a346e-ci$/,/^# <<< a346e-ci$/p' "$DEFCONFIG"

      # build_kernel.sh applies, in this order:
      #   apply_kernel66_patches : kernel/patches-kernel-6.6/*.patch (always)
      #   apply_optional_patches : Permissive/ (PERMISSIVE=true) + patch/*.patch (CUSTOM_PATCH=true)
      #   apply_compat_fixes     : inline loop.h / MIN-MAX / SEC_PM / UFS fixes
      # It also collects every built .ko under modules/, unconditionally and
      # cheaply -- packaging them into an artifact is this job's choice, not
      # the build script's.
      - name: Build kernel
        id: build
        run: |
          set -eu
          chmod +x ./build_kernel.sh
          echo "PERMISSIVE=$PERMISSIVE  CUSTOM_PATCH=$CUSTOM_PATCH  KSU_VAR=$KSU_VAR"
          if ! bash ./build_kernel.sh 2>&1 | tee build.log; then
            echo "::error::build_kernel.sh failed - see the build-log artifact"
            tail -n 60 build.log || true
            exit 1
          fi
          [ -f Image ] || { echo "::error::Image not produced"; find out -name Image -type f | head; exit 1; }
          echo "image_size=$(du -h Image | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "image_sha=$(sha256sum Image | cut -c1-16)"    >> "$GITHUB_OUTPUT"
          if [ "$PERMISSIVE" = "true" ]; then
            grep -q "SELinux permissive patch" build.log || echo "::warning::permissive requested but not confirmed in the log"
          fi
          ls -lh Image

      - name: Package AnyKernel3
        if: env.FEAT_ANYKERNEL3 == 'true'
        run: |
          set -eu
          git clone --depth 1 "$AK3_REPO" AnyKernel3
          [ -f AnyKernel3/anykernel.sh ] || { echo "::error::anykernel.sh missing in $AK3_REPO"; exit 1; }
          cp -v Image AnyKernel3/Image
          rm -rf AnyKernel3/.git AnyKernel3/.github
          ls -lh AnyKernel3

      - name: Bundle kernel modules (tar.xz -9)
        id: modules
        if: env.FEAT_MODULES_TARXZ == 'true'
        run: |
          set -eu
          if [ ! -d modules ] || [ -z "$(find modules -name '*.ko' -print -quit)" ]; then
            echo "::warning::no .ko modules were collected, skipping tarball"
            exit 0
          fi
          COUNT=$(find modules -name '*.ko' | wc -l)
          tar -cf - -C modules . | xz -9e -T0 > modules.tar.xz
          echo "tarball=modules.tar.xz" >> "$GITHUB_OUTPUT"
          echo "modules bundled: ${COUNT} .ko file(s), $(du -h modules.tar.xz | awk '{print $1}')"

      - name: Upload build artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.meta.outputs.artifact }}
          path: ${{ env.FEAT_ANYKERNEL3 == 'true' && 'AnyKernel3' || 'Image' }}
          if-no-files-found: error
          compression-level: 6

      - name: Upload kernel modules
        if: env.FEAT_MODULES_TARXZ == 'true' && steps.modules.outputs.tarball != ''
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.meta.outputs.artifact }}-modules
          path: modules.tar.xz
          if-no-files-found: error
          compression-level: 0

      - name: Upload build log (only when the build fails)
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: build-log-${{ github.run_id }}
          path: build.log
          if-no-files-found: warn

  # ==========================================================================
  # #7 Upload & Summary
  # ==========================================================================
  upload-summary:
    name: "#7 Upload & Summary"
    needs: build
    if: always()
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Report
        run: |
          set -eu
          {
            echo "### #7 Result: \`${{ needs.build.result }}\`"
            echo ""
            echo "- [x] Root variant: \`${KSU_VAR}\`"
            echo "- [x] KernelSU-Next: \`${{ needs.build.outputs.ksu_tag || 'n/a' }}\` (\`${{ needs.build.outputs.ksu_code || 'n/a' }}\`)"
            echo "- [x] SELinux: \`${{ needs.build.outputs.selinux || env.PERMISSIVE }}\`"
            echo "- [x] Image: \`${{ needs.build.outputs.image_size || 'n/a' }}\` sha256:\`${{ needs.build.outputs.image_sha || 'n/a' }}\`"
            echo "- [$( [ "$FEAT_ANYKERNEL3" = "true" ] && echo x || echo ' ' )] Packaged as AnyKernel3: \`${FEAT_ANYKERNEL3}\`"
            echo "- [$( [ -n "${{ needs.build.outputs.modules_tarball }}" ] && echo x || echo ' ' )] Kernel modules bundled: \`${FEAT_MODULES_TARXZ}\`"
            echo "- [x] Artifact: \`${{ needs.build.outputs.artifact || 'n/a' }}\`"
            echo ""
            echo "Pipeline: #1 done--#2 done--#3 done--#4 done--#5 done--#6 ${{ needs.build.result }}--#7 done"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Open an issue when the build fails
        if: needs.build.result == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          cat > issue.md <<EOF
          Build failed: [run ${{ github.run_id }}](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})

          | field | value |
          |---|---|
          | commit | \`${{ github.sha }}\` |
          | branch | \`${{ github.ref_name }}\` |
          | root variant | \`${KSU_VAR}\` |
          | permissive | \`${PERMISSIVE}\` |
          | extra patches | \`${CUSTOM_PATCH}\` |

          The \`build-log-${{ github.run_id }}\` artifact of that run has the full log.
          EOF
          gh issue create --title "Build failed #${{ github.run_id }} [${KSU_VAR}]" --body-file issue.md || true
          
